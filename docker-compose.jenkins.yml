services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "999"            # docker socket group, may need adjusting per machine
    networks:
      - safe-zone-net
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  safe-zone-net:
    external: true
