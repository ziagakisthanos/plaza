services:
  # ---------- Infrastructure ----------
  mongo:
    image: mongo:7
    container_name: buy02-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - buy02-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: buy02-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - buy02-net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: buy02-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - buy02-net

  # ---------- Discovery (must start first) ----------
  discovery:
    build: ./discovery
    container_name: buy02-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - buy02-net

  # ---------- Gateway ----------
  gateway:
    build: ./gateway
    container_name: buy02-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery
    networks:
      - buy02-net

  # ---------- Business services ----------
  user-service:
    build: ./user-service
    container_name: buy02-user
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - discovery
      - mongo
    networks:
      - buy02-net

  product-service:
    build: ./product-service
    container_name: buy02-product
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - discovery
      - mongo
      - kafka
    networks:
      - buy02-net

  media-service:
    build: ./media-service
    container_name: buy02-media
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - discovery
      - mongo
      - kafka
      - minio
    networks:
      - buy02-net

  frontend:
    build: ./frontend          # points at frontend/Dockerfile
    container_name: buy02-frontend
    ports:
      - "4200:80"              # host 4200 -> nginx port 80 in container
    depends_on:
      - gateway
    networks:
      - buy02-net

volumes:
  mongo-data:
  minio-data:
  kafka-data:

networks:
  buy02-net:
    driver: bridge