services:
  mongodb:
    image: mongo:7
    container_name: buy01-mongo
    ports:
      - "27017:27017"      # Mongo's default port
    volumes:
      - mongo-data:/data/db   # persist data so it survives container restarts

  minio:
    image: minio/minio:latest
    container_name: buy01-minio
    ports:
      - "9000:9000"     # the S3 API port (services talks to this)
      - "9001:9001"     # the web console (open in browser)
    environment:
      MINIO_ROOT_USER: minioadmin          # access key (like an S3 username)
      MINIO_ROOT_PASSWORD: minioadmin       # secret key — change for anything real
    command:
      server /data --console-address ":9001"
    volumes:
      - minio-data:/data                    # persists objects across restarts

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: buy01-kafka
    ports:
      - "9092:9092"        # the port where services connect to
    environment:
      # --- KRaft mode ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # --- listeners: how clients reach Kafka ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- single-node settings (dev only) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  mongo-data:
  minio-data:
  kafka-data: