server:
  port: 8084

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/orderdb
      auto-index-creation: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
